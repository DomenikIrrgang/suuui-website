# Production stack on the `suuui` droplet, installed at /opt/suuui.
# IMAGE_TAG is written to /opt/suuui/.env by suuui-deploy (see deploy.sh).
name: suuui

services:
  traefik:
    image: traefik:v3.7.15
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # lego reads the DigitalOcean token from this file; it never sits in the
      # environment or in the compose config.
      DO_AUTH_TOKEN_FILE: /run/secrets/do_token
      # DigitalOcean's nameservers can take longer than lego's default 60s to
      # all serve the challenge record.
      DO_PROPAGATION_TIMEOUT: "600"
      DO_POLLING_INTERVAL: "10"
    secrets:
      - do_token
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/acme:/acme
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [web]

  app:
    image: registry.digitalocean.com/suuui/suuui-website:${IMAGE_TAG:?IMAGE_TAG is not set}
    restart: unless-stopped
    environment:
      SITE_URL: https://suuui.dev
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks: [web]

secrets:
  do_token:
    file: ./secrets/do_token

networks:
  web:
