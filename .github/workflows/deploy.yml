name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: registry.digitalocean.com/suuui
  REPOSITORY: suuui-website
  KEEP_TAGS: 3

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets live on the environment, which only accepts the main branch.
    environment:
      name: production
      url: https://suuui.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # The registry is read-only while garbage collection runs.
      - name: Wait for registry garbage collection
        run: |
          for _ in $(seq 40); do
            doctl registry garbage-collection get-active >/dev/null 2>&1 || exit 0
            echo "garbage collection in progress, waiting..."
            sleep 15
          done
          echo "garbage collection still running after 10 minutes" >&2
          exit 1

      - name: Log in to registry
        run: doctl registry login --expiry-seconds 1200

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ github.sha }}
          build-args: SITE_URL=https://suuui.dev
          # A single plain manifest per tag keeps registry garbage collection
          # from treating attestation manifests as untagged.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to droplet
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key)
          # The key's forced command runs suuui-deploy with this argument.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "deploy@$DEPLOY_HOST" "$GITHUB_SHA"

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Prune old images
        run: |
          doctl registry repository list-tags "$REPOSITORY" --output json \
            | jq -r --argjson keep "$KEEP_TAGS" 'sort_by(.updated_at) | reverse | .[$keep:] | .[].tag' \
            > old-tags
          if [ -s old-tags ]; then
            xargs doctl registry repository delete-tag "$REPOSITORY" --force < old-tags
            doctl registry garbage-collection start --include-untagged-manifests --force
          fi
